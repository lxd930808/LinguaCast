# XcodeGen 工程描述 —— PodcastEnglishStudio (LinguaCast)
#
# 本文件是 `PodcastEnglishStudio.xcodeproj` 的唯一权威来源。工程文件由
# `xcodegen generate` 生成且不入库；任何 build 设置 / target / 依赖改动都改这里。
#
# 与旧 pbxproj 的对应关系（逐条核对）：
#   - app target：application，iOS + tvOS 双平台，部署目标均 17.0
#   - 条件项：INFOPLIST_FILE / ASSETCATALOG_COMPILER_APPICON_NAME /
#     TARGETED_DEVICE_FAMILY 的 [sdk=appletv*] 变体（见下方带 sdk 后缀的键）
#   - 签名：由使用者自己的 Apple Developer Team 管理；默认本地模式无需 CloudKit
#   - 版本：MARKETING_VERSION=0.2，CURRENT_PROJECT_VERSION=1，SWIFT_VERSION=5.0
#   - Core：以本地 SwiftPM 包产品 PodcastEnglishStudioCore 链接（根 Package.swift），
#     不再把 ../PodcastEnglishStudioCore/*.swift 直接编入 app target。

name: PodcastEnglishStudio

options:
  bundleIdPrefix: com.example
  defaultConfig: Debug
  developmentRegion: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

# 与旧工程 PBXProject 的 knownRegions 保持一致（String Catalog 本地化）。
knownRegions:
  - en
  - zh-Hans
  - zh-Hant
  - es
  - pt-BR
  - ja
  - ko
  - fr
  - de
  - ar
  - Base

# 本地 SwiftPM 包：根 Package.swift 提供 PodcastEnglishStudioCore 库与测试；
# Packages/DomainModels 提供 SwiftData @Model 共享底座；
# Packages/PlayerKit 提供音频播放控制层（AudioPlaybackController）；
# Packages/CloudSyncKit 提供 iCloud 同步层（CloudSyncCoordinator / SettingsStore /
# KeychainStore / AppConfiguration）。app 链接四者。
packages:
  PodcastEnglishStudio:
    path: .
  DomainModels:
    path: ../../Packages/DomainModels
  PlayerKit:
    path: ../../Packages/PlayerKit
  CloudSyncKit:
    path: ../../Packages/CloudSyncKit
  ChineseTTS:
    path: ../../Packages/ChineseTTS
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    exactVersion: 8.11.0
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    revision: 7cc81901f9bbf2f9d2766bd8a54e128b974e4c94

configs:
  Debug: debug
  Release: release
  CloudDebug: debug
  CloudRelease: release

# 工程级公共设置（对应旧 pbxproj 的工程级 Debug/Release）。
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TVOS_DEPLOYMENT_TARGET: "17.0"
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  PodcastEnglishStudio:
    type: application
    # 单 target 同时覆盖 iOS 与 tvOS（SUPPORTED_PLATFORMS 在 settings 里显式给出）。
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
      tvOS: "17.0"
    # 递归收集 app 源码与资源（含 Models/ Services/ Views/ Support/ Assets.xcassets），
    # 新增文件（如阶段 3 的 +iOS/+tvOS）不再需要改动工程描述。
    sources:
      - path: PodcastEnglishStudio
        excludes:
          # Info.plist / Info-tvOS.plist 通过 INFOPLIST_FILE 指定，不作为资源拷贝。
          - "Support/Info.plist"
          - "Support/Info-tvOS.plist"
          # entitlements 仅经 CODE_SIGN_ENTITLEMENTS 引用，不打包进 bundle。
          - "Support/PodcastEnglishStudio.entitlements"
          # 旧版 InfoPlist.strings 已迁移进 InfoPlist.xcstrings（同出于 a1178ed，且
          # .xcstrings 已含 zh-Hans「双语听译」）。二者同名共存会导致 actool 报错
          # “cannot co-exist with other .strings tables with the same name”，故排除。
          - "Support/en.lproj/InfoPlist.strings"
          - "Support/zh-Hans.lproj/InfoPlist.strings"
    postBuildScripts:
      - name: Copy local Chinese voice resources
        script: |
          "${SRCROOT}/scripts/copy-chinese-tts-resources.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: PodcastEnglishStudio
        product: PodcastEnglishStudioCore
      - package: DomainModels
        product: DomainModels
      - package: PlayerKit
        product: PlayerKit
      - package: CloudSyncKit
        product: CloudSyncKit
      - package: ChineseTTS
        product: ChineseSynthesis
        platformFilter: iOS
      - package: Kingfisher
        product: Kingfisher
      - package: YouTubeKit
        product: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LinguaCast
        PRODUCT_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "0.9"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        # 关闭编译器字符串提取：本项目统一走 L10n helper（key 为 String 变量，非字面量），
        # 编译器提取对其无效，只会产生 "References to this key could not be found" 误报。
        # catalog 一致性由 LocalizationCatalogTests 兜底保证。
        SWIFT_EMIT_LOC_STRINGS: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PodcastEnglishStudio/Support/Info.plist
        CODE_SIGN_STYLE: Automatic
        ICLOUD_CONTAINER_IDENTIFIER: ""
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator appletvos appletvsimulator"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        # --- tvOS 条件项（[sdk=appletv*]）---
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]": AppIconTV
        "INFOPLIST_FILE[sdk=appletv*]": PodcastEnglishStudio/Support/Info-tvOS.plist
        "TARGETED_DEVICE_FAMILY[sdk=appletv*]": "3"
      configs:
        Debug:
          APS_ENVIRONMENT: ""
          ICLOUD_CONTAINER_ENVIRONMENT: ""
        Release:
          APS_ENVIRONMENT: ""
          ICLOUD_CONTAINER_ENVIRONMENT: ""
        CloudDebug:
          CODE_SIGN_ENTITLEMENTS: PodcastEnglishStudio/Support/PodcastEnglishStudio.entitlements
          APS_ENVIRONMENT: development
          ICLOUD_CONTAINER_ENVIRONMENT: Development
        CloudRelease:
          CODE_SIGN_ENTITLEMENTS: PodcastEnglishStudio/Support/PodcastEnglishStudio.entitlements
          APS_ENVIRONMENT: production
          ICLOUD_CONTAINER_ENVIRONMENT: Production

  PodcastEnglishStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
      tvOS: "17.0"
    sources:
      - path: PodcastEnglishStudioUITests
    dependencies:
      - target: PodcastEnglishStudio
    settings:
      base:
        # Nest under the app id so Automatic signing can register a unique
        # `<id>.xctrunner` App ID for this team (choose an identifier unique to your account).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.LinguaCast.uitests
        PRODUCT_NAME: "$(TARGET_NAME)"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: PodcastEnglishStudio
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator appletvos appletvsimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        "TARGETED_DEVICE_FAMILY[sdk=appletv*]": "3"

schemes:
  PodcastEnglishStudio:
    build:
      targets:
        PodcastEnglishStudio: all
        PodcastEnglishStudioUITests: test
    run:
      config: Debug
      # Debug-only: Mac local SABR media service → AVPlayer verification.
      # Simulator can use 127.0.0.1; a physical device needs the Mac LAN IP and
      # the media service PUBLIC_BASE_URL must match that host.
      # Disabled: while present, every Xcode Debug launch (simulator or device)
      # resolves the effective iOS YouTube playback mode to the hidden
      # local-service option and keeps strict caption quality gates, overriding
      # the visible "official iframe" setting. Uncomment to re-enable.
      # environmentVariables:
      #   YT_PLAYBACK_BACKEND: local-service
      #   YT_LOCAL_MEDIA_BASE_URL: http://192.168.x.x:3210
      #   YT_LOCAL_MEDIA_TOKEN: dev-local-token
      #   YT_LOCAL_MEDIA_MODE: mp4
    test:
      config: Debug
      targets:
        - PodcastEnglishStudioUITests
    archive:
      config: Release

  PodcastEnglishStudio-CloudKit:
    build:
      targets:
        PodcastEnglishStudio: all
        PodcastEnglishStudioUITests: test
    run:
      config: CloudDebug
    test:
      config: CloudDebug
      targets:
        - PodcastEnglishStudioUITests
    archive:
      config: CloudRelease
